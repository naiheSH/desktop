name: Check Official Upstreams

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: check-official-upstreams
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        channel: [stable, beta]
    steps:
      - uses: actions/checkout@v7
      - name: Check official release
        uses: actions/github-script@v8
        env:
          UPSTREAM_CHANNEL: ${{ matrix.channel }}
        with:
          script: |
            const { checkOfficialUpstream } = await import(`${process.env.GITHUB_WORKSPACE}/script/check-official-upstream.mjs`)
            await checkOfficialUpstream({ github, repo: context.repo, channel: process.env.UPSTREAM_CHANNEL })
